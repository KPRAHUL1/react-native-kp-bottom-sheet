name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: example/package-lock.json

      # The example installs the package from npm like any other consumer, so
      # the deployed demo shows exactly the published version people get —
      # not whatever is on main.
      - name: Install example dependencies
        working-directory: example
        run: npm ci

      - name: Export web build
        working-directory: example
        run: npx expo export --platform web --output-dir dist

      # Expo emits root-absolute asset paths (/_expo/..., /favicon.ico), but a
      # GitHub Pages *project* site is served from /<repo>/, so those 404 and
      # the page renders blank. index.html sits at the site root, so relative
      # paths resolve correctly.
      - name: Rewrite absolute asset paths for project-page hosting
        working-directory: example/dist
        run: sed -i 's#="/_expo/#="./_expo/#g; s#="/favicon.ico"#="./favicon.ico"#g' index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: example/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
